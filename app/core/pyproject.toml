[project]
name = "math-teacher-core"
version = "0.1.0"
description = "수학 문제풀이 워크스페이스 공용 백엔드 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pymupdf",
    "pillow",
    "python-docx",
    "python-hwpx",
    "anthropic",
    "claude-agent-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D", "RUF"]
ignore = [
    "D203",   # D211 과 충돌
    "D213",   # D212 와 충돌
    "ANN401", # **kwargs: Any 허용
]

[tool.ruff.lint.per-file-ignores]
# 이식한 검증 코드(로직 변경 금지) + 테스트는 문서화 규칙을 느슨하게 적용한다.
"extractor.py" = ["D", "ANN", "B", "SIM"]
"pricing.py" = ["D", "ANN"]
"tests/*" = ["D", "ANN"]
# LaTeX -> 유니코드 매핑표. 기호가 라틴 문자와 닮은 것이 이 표의 존재 이유다.
"to_plain_text.py" = ["RUF001"]
"tests/test_to_plain_text.py" = ["RUF001"]
# LaTeX -> 수식 조판 매핑표. 위와 같은 이유다(⋃ vs U 등).
"export/omml.py" = ["RUF001"]
"tests/test_math_typesetting.py" = ["RUF001"]
# PUA 오프셋 -> LaTeX 매핑표. 확정 근거 주석에 원본 글리프(α, ° 등)를 그대로
# 적어야 대조가 가능하다 — 라틴 문자와 닮은 것이 오히려 요점이다.
"pua_table.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "."
exclude = "(^|/)data/"

[[tool.mypy.overrides]]
module = ["fitz", "extractor", "pricing", "docx", "docx.shared"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
